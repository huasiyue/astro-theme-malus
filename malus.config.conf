item = 支持模板 | #sponsor-methods | heart | primary | true
item = 感谢名单 | #sponsor-thanks | coffee | secondary | true

# 赞助方式区块。
[sponsor.methodsSection]
kicker = Methods
title = 赞助方式
description = 可选的支持方式。

# 感谢名单区块。
[sponsor.thanksSection]
kicker = Thanks
title = 感谢名单
description = 记录支持、反馈和共建。

# 赞助方式列表。
# 字段顺序：名称 | 描述 | 链接 | 图片 | 角标
# 如果是二维码，填写图片字段，链接字段留空。
# 如果是外部赞助平台，填写链接字段，图片字段留空。
[sponsor.methods]
item = 微信赞赏 | 适合放置微信赞赏码。 | | /images/sponsor-placeholder.svg | 示例
item = 爱发电 / GitHub Sponsors | 适合放长期赞助链接、会员页或 GitHub Sponsors 主页。 | https://example.com | | 链接

# 感谢名单。
# 字段顺序：名称 | 留言 | 日期
[sponsor.thanks]
item = {siteName} Supporter | 感谢每一次下载、使用、反馈和二次创作。 |

# 评论总开关和评论服务选择。
[comments]
# 当前支持 giscus 或 none。
provider = giscus
# 是否启用评论。还会受到 features.comments 和 plugins.giscus 影响。
enabled = true

# giscus 配置。需要去 https://giscus.app/ 生成 repoId 和 categoryId。
[comments.giscus]
# 是否显示本地配置提示。留空时开发环境显示，生产环境隐藏。
showSetup =
# GitHub 仓库，格式 owner/repo。
repo =
# giscus 生成的 repoId。
repoId =
# GitHub Discussions 分类名称。
category = General
# giscus 生成的 categoryId。
categoryId =
# 评论和页面的映射方式。普通博客建议 pathname。
mapping = pathname
# giscus 严格匹配开关，通常保持 0。
strict = 0
# 是否开启表情反应，1 开启，0 关闭。
reactionsEnabled = 1
# 是否输出 metadata，通常保持 0。
emitMetadata = 0
# 评论输入框位置，bottom 或 top。
inputPosition = bottom
# 浅色主题名称。
lightTheme = noborder_light
# 深色主题名称。
darkTheme = noborder_dark

# 浏览量配置。
[views]
# 浏览量接口路径。Cloudflare Pages Functions 默认是 /api/views。
endpoint = /api/views
# 本地开发或接口不可用时，是否退回浏览器本地计数。
localFallback = true

# 统计脚本预留配置。默认不开启。
[analytics]
# 支持 none、umami、plausible。当前只是预留。
provider = none
# 是否启用统计脚本。
enabled = false
# 统计脚本地址。
scriptUrl =
# Umami 等服务的网站 ID。
websiteId =
# Plausible 等服务的域名字段。
domain =
