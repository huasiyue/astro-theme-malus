# Malus plain text config
# 普通使用者只需要改这个文件，不需要改 src/config 里的 TypeScript 文件。
#
# 写法规则：
# 1. true 表示开启，false 表示关闭。
# 2. 不要在配置值后面写注释，比如 name = Malus # 错误。
# 3. 注释必须单独一行，并且用 # 开头。
# 4. 多个列表项用多行 item = ...。
# 5. 列表项字段用 | 分隔，字段为空就留空。
# 6. line = ... 用来拼多行文本，比如友链申请格式。
# 7. 改完后运行 npm run build 检查配置是否可用。
#
# 可用占位符：
# {siteName}        站点名称，来自 [site] name
# {siteDescription} 站点描述，来自 [site] description
# {siteUrl}         站点地址，来自 [site] url
# {githubUrl}       GitHub 地址，来自 [site] githubUrl
# {authorName}      作者名称，来自 [author] name
# {authorHandle}    作者账号，来自 [author] handle
# {avatarUrl}       作者头像，来自 [author] avatar
#
# 常用图标名称：
# arrow-right, archive, book, coffee, external, folder, github, grid, heart,
# link, rss, search, settings, spark, tag, users

# [site] 控制整个站点的基础信息，会影响首页、导航、页脚、SEO、RSS 和 Sitemap。
[site]
# 站点名称。会显示在首页标题、顶部品牌、页脚、RSS 和 SEO 中。
name = Malus
# 顶部左侧小方块里的短标识。建议 1 到 2 个字符。
brandMark = M
# 站点描述。会显示在顶部品牌副标题、页脚、SEO、RSS 中。
description = A refined Astro blog template inspired by Malus halliana.
# 线上正式域名。上线前必须改成真实地址，会影响 canonical、RSS、Sitemap。
url = https://example.com
# GitHub 仓库或个人主页。features.github = false 时，顶部和页脚 GitHub 入口会隐藏。
githubUrl = https://github.com/huasiyue/astro-theme-malus
# 站点开始运行时间。首页运行时间卡片会从这个时间开始计算。
launchedAt = 2026-05-15T00:00:00+08:00
# 默认语言。当前模板默认中文，普通使用者建议保持 zh。
defaultLang = zh
# 支持的语言列表。当前固定界面支持 zh 和 en。
supportedLangs = zh, en

# [author] 控制作者信息，会影响头像、友链本站卡片、SEO 作者信息。
[author]
# 作者或模板维护者名称。
name = Malus Theme
# 作者账号。可写 GitHub 用户名、网名或站点 handle。
handle = malus-theme
# 邮箱。默认留空，不会显示。
email =
# 头像路径。公共图片放 public/images/，私人图片建议放 public/local/。
avatar = /images/avatar-default.png

# [features] 是功能开关。关闭后，相关导航、首页入口、页脚入口和组件会自动隐藏。
[features]
# 搜索入口。依赖 [plugins] pagefind；关闭后顶部搜索图标和搜索弹窗隐藏。
search = true
# GitHub 入口。关闭后顶部和页脚 GitHub 图标隐藏。
github = true
# RSS 入口。依赖 [plugins] rss；关闭后 RSS 链接隐藏，/rss.xml 返回 404。
rss = true
# 亮色、暗色、跟随系统主题切换按钮。
themeSwitch = true
# 中英文切换入口。当前英文页是轻量占位页。
languageSwitch = true
# 文章评论区。依赖 [plugins] giscus 和 [comments] 配置。
comments = true
# 文章浏览量 chip。依赖 [plugins] cloudflareViews 或本地 fallback。
views = true
# 友链功能。关闭后导航、首页友链入口、页脚友链入口隐藏，友链页 noindex。
friends = true
# 赞助功能。关闭后导航、首页赞助入口、页脚赞助入口隐藏，赞助页 noindex。
sponsor = true
# 项目页和项目模块入口。关闭后项目导航、首页项目模块入口隐藏。
projects = true
# 工具页入口。关闭后工具导航和首页工具入口隐藏。
tools = true
# 文章图片点击放大。关闭后正文图片不再启用灯箱。
imageLightbox = true
# 代码块复制按钮。关闭后文章代码块右上角复制按钮隐藏。
codeCopy = true
# 首页站点运行时间卡片。关闭后只隐藏该卡片。
runtime = true

# [plugins] 是插件能力开关。features 更像页面功能，plugins 更像底层支持能力。
[plugins]
# Pagefind 静态搜索索引。关闭后搜索功能即使开启也不会显示。
pagefind = true
# giscus GitHub Discussions 评论。关闭后评论组件不会加载。
giscus = true
# Cloudflare Pages Functions + D1 浏览量接口能力。
cloudflareViews = true
# MDX 内容支持。当前项目已安装 MDX，建议保持开启。
mdx = true
# RSS 输出能力。关闭后 /rss.xml 不输出。
rss = true
# Sitemap 输出能力。关闭后 robots.txt 不再写入 sitemap 地址。
sitemap = true
# Mermaid 图表预留开关。当前只是预留，开启前还需要实现渲染组件。
mermaid = false
# KaTeX 数学公式预留开关。当前只是预留，开启前还需要实现渲染组件。
katex = false
# 统计脚本预留开关。需要配合 [analytics] 使用。
analytics = false

# 顶部导航配置。
# 字段顺序：链接 | 中文名称 | 英文名称 | 是否显示 | 关联功能 | 关联插件
# 是否显示填 true/false。
# 关联功能可选，比如 projects、friends、sponsor。对应 [features] 关闭后自动隐藏。
# 关联插件可选，比如 rss。对应 [plugins] 关闭后自动隐藏。
[navigation.items]
# 文章列表页。首页默认主按钮也指向这里。
item = /zh/blog/ | 文章 | Posts | true
# 文章归档页。按年份展示公开文章。
item = /zh/archive/ | 归档 | Archive | true
# 标签索引页。展示文章标签云。
item = /zh/tags/ | 标签 | Tags | true
# 项目页。关联 projects 功能。
item = /projects/ | 项目 | Projects | true | projects
# 工具页。关联 tools 功能。
item = /tools/ | 工具 | Tools | true | tools
# 友链页。关联 friends 功能。
item = /friends/ | 友链 | Friends | true | friends
# 赞助页。关联 sponsor 功能。
item = /sponsor/ | 赞助 | Sponsor | true | sponsor
# 关于页。通常建议保留。
item = /about/ | 关于 | About | true

# [home] 控制首页模块显示。首页本身不能关闭，但模块都可以开关。
[home]
# 首页大精选文章卡片。
showFeaturedPost = true
# 首页右侧 Liquid Glass 视觉面板。
showLiquidPanel = true
# 首页统计卡片区，包括文章数量、标签数量、运行时间、最近更新。
showStats = true
# 首页下方文章路线列表。
showGuideList = true
# 首页下方右侧项目模块列表。还受 features.projects 控制。
showProjectModules = true
# 首页快捷入口里的友链入口。还受 features.friends 控制。
showFriendEntry = true
# 首页快捷入口里的赞助入口。还受 features.sponsor 控制。
showSponsorEntry = true

# [home.hero] 控制首页首屏左侧标题、说明和头像替代文本。
[home.hero]
# 标题上方的小胶囊文字。
kicker = 垂丝海棠模板 / Astro Theme
# 首页主标题。默认用 {siteName} 读取 [site] name。
title = {siteName}
# 首页主说明。适合写模板定位、个人介绍或站点价值。
description = 一套可以发布模板、也可以长期写作的 Astro 静态博客：首页展示设计思路、文章入口、友链和赞助，文章页承载教程与真实博客内容。
# 头像 alt 文本，用于无障碍和图片加载失败时的说明。
avatarAlt = {authorName} avatar

# 首页 Hero 按钮。
# 字段顺序：文字 | 链接 | 图标 | primary/secondary | 是否显示 | 关联功能 | 关联插件
# primary 是主按钮，secondary 是次按钮。
[home.hero.actions]
# 主按钮，默认进入文章列表。
item = 阅读文章 | /zh/blog/ | arrow-right | primary | true
# 次按钮，默认进入友链页。关联 friends 功能。
item = 友链与赞助 | /friends/ | heart | secondary | true | friends

# 首页精选文章卡片的固定文案。
[home.featuredPost]
# 卡片左上角标签。
label = Featured
# 没有文章时显示的标题。
emptyTitle = 文章正在准备中
# 没有文章时显示的说明。
emptyDescription = 这里会展示配置中的精选内容入口。
# 精选文章链接的无障碍前缀。
readAriaPrefix = 阅读

# 首页 Liquid Glass 面板中的三张小浮层卡片。
# 字段顺序：小标签 | 主文字
[home.liquidPanel.cards]
item = Writing | Markdown / MDX
item = Projects | Astro / TypeScript
item = Tools | Theme / RSS / Search

# 首页统计卡片：文章数量。
[home.stats.guides]
# 卡片上方文字。
label = 公开文章
# 卡片下方单位。
unit = 篇内容

# 首页统计卡片：标签数量。
[home.stats.tags]
label = 内容标签
unit = 个主题

# 首页统计卡片：站点运行时间。
[home.stats.runtime]
label = 模板运行
unit = 本地预览

# 首页统计卡片：最近更新文章。
[home.stats.latest]
label = 最近更新
unit = Latest
# 没有文章时显示的值。
emptyValue = 准备中

# 首页快捷入口卡片。
# 字段顺序：文字 | 链接 | 图标 | 是否显示 | 关联功能 | 关联插件
[home.quickLinks]
# 工具页入口。关联 tools 功能。
item = 工具 | /tools/ | grid | true | tools
# RSS 入口。关联 rss 功能和 rss 插件。
item = RSS | /rss.xml | rss | true | rss | rss
# 标签页入口。
item = 标签 | /zh/tags/ | tag | true
# 友链入口。关联 friends 功能。
item = 友链 | /friends/ | users | true | friends
# 赞助入口。关联 sponsor 功能。
item = 赞助 | /sponsor/ | heart | true | sponsor

# 首页文章路线区。
[home.guideSection]
# 只优先展示这个 series 的文章。文章 frontmatter 的 series 要一致。
series = Malus 模板文档
# 首页最多展示几篇文章。
limit = 6
# 区块小标题。
kicker = Template Guide
# 区块主标题。
title = 文章与教程路线
# 区块说明。
description = 默认收录模板设计、使用、配置、部署和定制教程；作为个人博客后，也可以继续展示真实写作内容。

# 首页项目模块区。
[home.projectSection]
# 区块小标题。
kicker = Template Modules
# 查看全部项目链接文字。
allLabel = 全部模块
# 精选项目标签文字。
featuredLabel = Featured
# 首页最多展示几个项目。
limit = 3

# 页面通用字段说明：
# title       浏览器标题和 SEO 标题。
# description SEO 描述。
# kicker      页面首屏小标题。
# heading     页面首屏主标题。
# body        页面首屏说明文字。

# 关于页。
[pages.about]
title = 关于
description = 关于 {siteName} Astro 内容模板。
kicker = About
heading = 关于 {siteName}
body = {siteName} 是一套以垂丝海棠为视觉线索的 Astro 静态博客模板，可以先作为模板仓库发布到 GitHub，也可以直接作为个人博客长期写作。

# 关于页下方说明卡片。
# 字段顺序：图标 | 标题 | 描述 | 链接 | 是否显示 | 关联功能 | 关联插件
[pages.about.cards]
item = book | 模板定位 | 默认提供文章、标签、归档、项目、工具、友链、赞助、搜索、RSS、主题切换和评论预留。 | | true
item = folder | 内容维护 | 内容通过 Markdown / MDX 和配置文件维护，站点信息、页面文案和公共模块都能快速替换。 | | true

# 工具页。
[pages.tools]
title = 工具
description = {siteName} 的模板工具和扩展入口。
kicker = Tools
heading = 工具
body = 工具页收纳站内常用入口和后续扩展能力。

# 工具页卡片。
# 字段顺序：图标 | 标题 | 描述 | 链接 | 是否显示 | 关联功能 | 关联插件
[pages.tools.cards]
item = tag | 标签索引 | 从标签重新组织文章主题。 | /zh/tags/ | true
item = archive | 时间归档 | 按年份展示内容沉淀。 | /zh/archive/ | true
item = rss | RSS 订阅 | 把站点更新接入阅读器。 | /rss.xml | true | rss | rss
item = users | 友链 | 维护站点伙伴和社区入口。 | /friends/ | true | friends
item = heart | 赞助 | 展示支持方式和感谢名单。 | /sponsor/ | true | sponsor

# 项目页。
[pages.projects]
title = 项目
description = {siteName} 的项目模块展示入口。
kicker = Projects
heading = 项目
body = 这里展示项目卡片结构，可用于作品集、产品模块、案例展示或工具说明。
# 没有公开项目时显示的空状态文字。
emptyText = 暂无公开项目。

# 文章列表页。
[pages.blogIndex]
title = 文章
description = {siteName} 的中文文章列表。
kicker = Posts
heading = 文章
body = 这里默认收录 {siteName} 的设计理念、使用方式、配置、部署和自定义教程；作为个人博客使用时，也会展示你新增的 Markdown / MDX 文章。
# 文章列表首屏最多显示几个标签。
tagLimit = 8
emptyText = 暂无公开文章。

# 归档页。
[pages.archive]
title = 归档
description = {siteName} 的文章时间归档。
kicker = Archive
heading = 归档
body = 按年份组织所有公开文章，方便回看写作轨迹。
emptyText = 暂无公开文章。

# 标签索引页。
[pages.tags]
title = 标签
description = {siteName} 的文章标签索引。
kicker = Tags
heading = 标签
body = 标签帮助内容形成多条入口：技术栈、写作主题、设计系统和项目模块都会在这里交叉。
emptyText = 暂无标签。

# 标签详情页。{tag} 是当前标签，{count} 是文章数量。
[pages.tagDetail]
titleTemplate = 标签：{tag}
descriptionTemplate = {siteName} 中带有 {tag} 标签的文章。
kicker = Tag
countTemplate = 共 {count} 篇文章。
emptyText = 这个标签下暂无公开文章。

# 404 页面。
[pages.notFound]
title = 页面未找到
description = 这个页面不存在或已经移动。
kicker = 404
heading = 页面未找到
body = 这个地址暂时没有内容。可以回到首页，或者从文章列表重新开始。

# 404 页面按钮。
# 字段顺序：文字 | 链接 | 图标 | primary/secondary | 是否显示 | 关联功能 | 关联插件
[pages.notFound.actions]
item = 回到首页 | / | arrow-right | primary | true
item = 文章列表 | /zh/blog/ | book | secondary | true

# 英文占位页。当前模板是中文优先，这里解释英文支持策略。
[pages.english]
title = English content coming soon
description = {siteName} keeps fixed interface text bilingual, while long-form content stays Chinese-first by default.
kicker = English
heading = English support is lightweight
body = {siteName} translates fixed interface text such as navigation, search, theme controls, comments, and reading actions. Long-form pages and posts stay Chinese-first unless a specific English version is needed.

# 英文占位页按钮。
[pages.english.actions]
item = Back to Chinese home | / | arrow-right | primary | true
item = Browse posts | /zh/blog/ | grid | secondary | true

# /zh/ 跳转页。访问 /zh/ 时会回到首页。
[pages.zhRedirect]
title = 中文首页
description = 正在前往 {siteName} 首页。
kicker = Redirect
heading = 正在前往首页
body = 如果页面没有自动跳转，可以返回首页继续阅读。
linkLabel = 返回首页

# [blog] 控制文章页和文章列表的阅读体验。
[blog]
# 中文文章列表基础路径。普通使用者建议保持 /zh/blog。
basePath = /zh/blog
# 预留分页数量。当前列表页还没有分页，后续扩展会用到。
postsPerPage = 9
# 是否显示阅读时间。
showReadingTime = true
# 是否显示 updatedDate 更新日期。
showUpdatedDate = true
# 是否显示文章目录。
showToc = true
# 是否显示相关文章。
showRelatedPosts = true
# 是否显示上一篇、下一篇。
showPreviousNext = true
# 是否允许草稿字段。draft: true 的文章不会公开显示。
draftEnabled = true

# 友链页基础文案。
